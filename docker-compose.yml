version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: orbitwatch_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Arihant@006
      MYSQL_DATABASE: orbitwatch_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
